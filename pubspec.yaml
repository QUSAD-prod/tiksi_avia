name: tiksi_avia
description: "TiksiAvia — онлайн-табло самолётов и вертолётов аэропорта Тикси в стиле VKUI."
publish_to: "none"

version: 2.0.0+6

environment:
  sdk: ^3.9.0

dependencies:
  connectivity_plus: ^7.3.2
  cupertino_icons: ^2.0.0
  email_validator: ^3.0.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  firebase_database: ^13.0.0
  firebase_messaging: ^17.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  package_info_plus: ^10.2.2
  provider: ^6.1.5+1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
        - asset: fonts/Poppins-Light.ttf
          weight: 300
